name: Sevaniq Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/db_sevaniq_ci?schema=public"

      - name: Static Analysis & Lint
        run: npm run lint

      - name: Unit Tests (Vitest)
        run: npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: "ci-test-secret-minimum-32-characters-long"
          SUPER_ADMIN_JWT_SECRET: "ci-test-super-admin-secret-minimum-32-chars"

      - name: E2E RBAC & Validation Tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: "ci-test-secret-minimum-32-characters-long"
          SUPER_ADMIN_JWT_SECRET: "ci-test-super-admin-secret-minimum-32-chars"

      - name: Typecheck & Production Build
        run: npm run build
