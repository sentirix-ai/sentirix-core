services:
  postgres:
    image: postgres:16-alpine
    container_name: sentirix-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_sentrix
    ports:
      - "5432:5432"
    volumes:
      - sentirix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_sentrix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sentirix_pgdata:
    name: sentirix_postgres_data
