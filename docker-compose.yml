services:
  postgres:
    image: postgres:16-alpine
    container_name: sevaniq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_sevaniq
    ports:
      - "5432:5432"
    volumes:
      - sevaniq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_sevaniq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sevaniq_pgdata:
    name: sevaniq_postgres_data
